<div class="vh-100 d-flex align-items-center justify-content-center"
  style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-lg">
          <div class="card-header bg-transparent text-center py-4">
            <h3 class="text-primary fw-bold mb-0">Bienvenido</h3>
            <span class="text-muted small">Proyecto Final Notifications</span>
          </div>
          <div class="card-body p-4">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="username" class="form-label small text-muted">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="fas fa-user text-primary"></i>
                  </span>
                  <input type="text" formControlName="username" class="form-control border-start-0 shadow-none"
                    placeholder="Ingresar usuario"
                    [ngClass]="{ 'is-invalid': submitted && loginForm.get('username')?.errors }">
                  <div *ngIf="submitted && loginForm.get('username')?.errors" class="invalid-feedback">
                    <div *ngIf="loginForm.get('username')?.errors?.['required']">El usuario es necesario</div>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label small text-muted">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="fas fa-lock text-primary"></i>
                  </span>
                  <input type="password" formControlName="password" class="form-control border-start-0 shadow-none"
                    placeholder="Ingresar contraseña"
                    [ngClass]="{ 'is-invalid': submitted && loginForm.get('password')?.errors }">
                  <div *ngIf="submitted && loginForm.get('password')?.errors" class="invalid-feedback">
                    <div *ngIf="loginForm.get('password')?.errors?.['required']">Se requiere contraseña</div>
                  </div>
                </div>
              </div>
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg shadow-none">Ingresar</button>
              </div>
              <div *ngIf="error" class="alert alert-danger mt-3 small rounded-0">
                {{error}}
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
